name: Android

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Check core, facade and C ABI
        run: |
          cargo check -p shio-core -p shio -p shio-ffi --target aarch64-linux-android
          cargo check -p shio-core -p shio -p shio-ffi --target x86_64-linux-android

      - name: Check sync feature
        run: |
          cargo check -p shio --features sync --target aarch64-linux-android
          cargo check -p shio --features sync --target x86_64-linux-android

      - name: Check C header
        run: |
          printf '#include "shio.h"\n' > /tmp/shio-header.c
          cc -fsyntax-only -I crates/shio-ffi/include /tmp/shio-header.c
