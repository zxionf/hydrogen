[workspace]
resolver = "2"
members = ["crates/*", "tests"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
shio-core = { path = "crates/shio-core" }
shio-sync = { path = "crates/shio-sync" }
shio = { path = "crates/shio" }

argon2 = "0.6"
base64 = "0.22"
chacha20poly1305 = "0.11"
getrandom = "0.4"
hkdf = "0.13"
redb = "4.4"
rustix = { version = "1.1", features = ["fs"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v7"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
