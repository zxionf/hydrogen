[package]
name = "shio-ffi"
description = "shio 的 C ABI 边界（v1）"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
shio = { workspace = true, features = ["sync"] }
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

# 用户已批准 shio-ffi 的 unsafe 例外：不能继承 workspace 的 forbid；
# crate 级仍拒绝 unsafe，只有 src/ffi.rs 边界模块局部 allow。
# 下面的 clippy 列表与 workspace lints 保持同步。
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
